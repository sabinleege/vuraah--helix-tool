services:
  api:
    build: ../services/api
    environment:
      HELIX_DB_PATH: /data/helix.db
    volumes:
      - helix_data:/data
    ports:
      - "8000:8000"
  web:
    build: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: helix
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  helix_data:
  pg_data:
